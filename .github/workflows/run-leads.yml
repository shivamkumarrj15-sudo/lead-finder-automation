name: Daily Lead Generation

on:
  schedule:
    # 7:00 PM IST is 1:30 PM UTC (13:30 UTC)
    # Cron format: 'Minute Hour DayOfMonth Month DayOfWeek'
    - cron: '30 13 * * *'
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub UI at any time

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Lead Finder Scraper
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEARCH_LOCATION: ${{ secrets.SEARCH_LOCATION }}
          MAX_RESULTS_PER_SEARCH: 50
          SKIP_TOP_RESULTS: 10
          MAX_LEADS_PER_DAY: 5
          MIN_REVIEWS_COUNT: 10
          MIN_RATING: 4.0
        run: node index.js
